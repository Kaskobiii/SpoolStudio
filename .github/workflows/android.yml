name: Android checks and test APK

on:
  push:
    branches: [shared-spools]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test companion plugin
        working-directory: orca_plugin
        run: python -m unittest -v
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the runner's Java 21 installation
        run: rm -f gradle/gradle-daemon-jvm.properties
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, check and build
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save test results and test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpoolStudio-Shared-test-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
